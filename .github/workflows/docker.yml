name: docker
# Builds the image on every push. Pushes to Docker Hub only when the
# DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN secret are set.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
jobs:
  image:
    runs-on: ubuntu-latest
    env:
      CAN_PUSH: ${{ secrets.DOCKERHUB_TOKEN != '' && vars.DOCKERHUB_USERNAME != '' }}
      IMAGE: ${{ vars.DOCKERHUB_USERNAME || 'digitalcave' }}/site-preflight
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: env.CAN_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.CAN_PUSH == 'true' }}
          load: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - if: env.CAN_PUSH == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: "Check a website before launch: links, HTTPS, redirects, SEO basics"
          readme-filepath: ./README.md
